  w.append(el("h3", "", t("req")), el("div", "cmp " + cm[2], cm[0] + " " + t(cm[1])));
  const g = el("div", "sp");
  [["Android", s.android], [t("mem"), s.ram], [t("gpu"), s.gpu], [t("soc"), s.soc], [t("abi"), s.arch], [t("sto"), s.storage], [t("ctl"), s.controller ? t("yes") : null]].forEach(([l, v]) => { const d = el("div"); d.append(el("small", "", l), el("span", "", v || "—")); g.append(d); });
  w.append(g); if (!compact) w.append(el("p", "rn", t("req_note"))); return w;
}
function acts(i, full) {
  const a = el("div", "acts"), add = (x, u, c) => { const e = el("a", c || "", x); e.href = u; e.target = "_blank"; e.rel = "noopener"; a.append(e); };
  add(t("src"), i.url, "p"); add(t("readme"), i.url + "#readme"); if (i.release) add(t("rels"), i.release.url);
  const f = el("button", "chip" + (follows.includes(i.id) ? " on" : ""), follows.includes(i.id) ? t("following") : t("follow")); f.onclick = () => { toggleFollow(i); if (full) sheet(i); }; a.append(f);
  return a;
}
function nameEl(i) { const n = el("div", "nm"); n.append(i.owner + "/", el("b", "", i.name)); return n; }
function card(i, rank) {
  const c = el("article", "card" + (i.assets ? " warn" : "")), n = nameEl(i); n.onclick = () => sheet(i); c.append(n);
  if (i.desc) { const d = el("p", "ds", i.desc); d.dir = "auto"; c.append(d); }
  c.append(tags(i, rank), reqs(i, true), acts(i)); return c;
}
function row(i, lead) { const r = el("div", "r2"); r.tabIndex = 0; r.onclick = () => sheet(i); r.onkeydown = e => { if (e.key === "Enter") sheet(i); }; if (lead) r.append(el("span", "ld", lead)); const n = nameEl(i); n.style.flex = "1"; r.append(n, el("span", "mt", ago(lead ? i._d : i.pushed))); return r; }
function sheet(i) {
  const s = $("sc"); s.textContent = ""; const d = el("div", "in");
  d.append(nameEl(i), tags(i), reqs(i), el("h2", "", t("dev")));
  const p = el("p", "ds", i.desc || "—"); p.dir = "auto"; d.append(p);
  if (i.assets) d.append(el("div", "note", t("needs") + ". " + t("note")));
  d.append(acts(i, true));
  const sh = el("button", "chip", t("share")); sh.onclick = async () => { try { if (navigator.share) await navigator.share({title: i.name, url: i.url}); else { await navigator.clipboard.writeText(i.url); toast(t("copied")); } } catch(e){} };
  const rp = el("a", "chip", t("suggest")); rp.href = "mailto:" + DEV.email + "?subject=" + encodeURIComponent(t("sug_sub") + " - " + i.id);
  d.append(el("div", "acts", ""), sh, rp); s.append(d); $("sh").classList.add("open");
}
function phoneSheet() {
  const s = $("sc"); s.textContent = ""; const d = el("div", "in"); d.append(el("h2", "", t("my_phone")), el("p", "rn", t("ph_note")));
  const mk = (label, vals, cur, unit) => { const l = el("label", "fl", label), sel = el("select"), o0 = el("option", "", t("ph_auto")); o0.value = ""; sel.append(o0); vals.forEach(v => { const o = el("option", "", v + unit); o.value = v; o.selected = cur === v; sel.append(o); }); l.append(sel); d.append(l); return sel; };
  const a = mk(t("ph_and"), [16, 15, 14, 13, 12, 11, 10, 9, 8, 7, 6, 5], Math.floor((phone && phone.android) || 0), ""), r = mk(t("ph_ram"), [1, 2, 3, 4, 6, 8, 12, 16], (phone && phone.ram) || 0, " GB");
  const sv = el("button", "chip on", t("ph_save")); sv.onclick = () => { phone = {android: +a.value || 0, ram: +r.value || 0}; store.set("gp-phone", phone); $("sh").classList.remove("open"); controls(); render(); };
  d.append(sv); s.append(d); $("sh").classList.add("open");
}
$("ph").onclick = phoneSheet;
$("sh").onclick = e => { if (e.target === $("sh")) $("sh").classList.remove("open"); };
addEventListener("keydown", e => { if (e.key === "Escape") $("sh").classList.remove("open"); });
function devBlock() {
  const d = $("dev"); d.textContent = ""; d.append(el("b", "", t("dev_t")), " ");
  const f = el("a", "", t("fb")); f.href = DEV.fb; f.target = "_blank"; f.rel = "noopener";
  const m = el("a", "", DEV.email); m.href = "mailto:" + DEV.email + "?subject=" + encodeURIComponent(t("sug_sub"));
  d.append(f, " · ", m);
}
function render() {
  const g = $("g"); g.textContent = ""; const k = q.toLowerCase(), pr = FAMS[fam];
  const m = i => (!pr || pr.test(txt(i))) && (!k || txt(i).toLowerCase().includes(k) || i.owner.toLowerCase().includes(k));
  let list = [], paint;
  if (view === "news") {
    items.forEach(i => { if (!m(i)) return; if (i.release && i.release.date) list.push({_o: i, _d: i.release.date, _l: "🚀"}); if (i.first_seen && days(i.first_seen) <= 90) list.push({_o: i, _d: i.first_seen, _l: "🆕"}); });
    list.sort((a, b) => new Date(b._d) - new Date(a._d));
    paint = x => { const r = row(Object.assign({}, x._o, {_d: x._d}), x._l); r.onclick = () => sheet(x._o); g.append(r); };
  } else if (view === "az") { list = items.filter(m).sort((a, b) => a.name.localeCompare(b.name, "en")); paint = i => g.append(row(i)); }
  else if (view === "fol") { list = items.filter(i => follows.includes(i.id) && m(i)).sort((a, b) => new Date(b.pushed) - new Date(a.pushed)); paint = i => g.append(card(i)); }
  else {
    list = items.filter(i => (flt === "all" || (flt === "new" && days(i.pushed) <= 30) || (flt === "assets" && i.assets) || (flt === "rel" && i.release) || (flt === "ok" && compat(i) === "ok")) && (!stg || stageOf(i) === stg) && m(i));
    const by = {stars: (a, b) => b.stars - a.stars, dl: (a, b) => (b.downloads || 0) - (a.downloads || 0) || b.stars - a.stars, upd: (a, b) => new Date(b.pushed) - new Date(a.pushed), rel: (a, b) => new Date(b.release ? b.release.date : 0) - new Date(a.release ? a.release.date : 0)};
    list.sort(by[sort]); paint = (i, n) => g.append(card(i, sort === "stars" || sort === "dl" ? n + 1 : 0));
  }
  list.slice(0, shown).forEach(paint);
  $("st").textContent = !items.length ? t("nodata") : list.length ? list.length + (view === "news" ? "" : t("cnt")) : view === "fol" ? t("empty_f") : t("empty");
  $("more").hidden = list.length <= shown;
}

// ---- الإشعارات ----
const cacheJ = async (k, v) => { try { const c = await caches.open("gp-data"); if (v === undefined) { const r = await c.match(k); return r ? await r.json() : null; } await c.put(k, new Response(JSON.stringify(v))); } catch(e){ return null; } };
function syncSW() { cacheJ("cfg", {notif, follows, lang}); }
async function notify(title, body, tag) {
  try { const reg = await navigator.serviceWorker.ready; await reg.showNotification(title, {body, tag, icon: "icon-192.png", badge: "icon-192.png", lang, dir: lang === "ar" ? "rtl" : "ltr", data: {url: "./"}}); }
  catch(e) { try { new Notification(title, {body, tag}); } catch(x){} }
}
function banner(txt) {
  const b = $("bn"); b.textContent = txt + "  ›"; b.style.display = "block";
  b.onclick = () => { b.style.display = "none"; view = "news"; controls(); render(); scrollTo({top: 0, behavior: "smooth"}); };
  clearTimeout(banner.x); banner.x = setTimeout(() => b.style.display = "none", 9000);
}
async function checkChanges() {
  const local = store.get("gp-snap", null), cur = {}; items.forEach(i => cur[i.id] = i.release ? i.release.tag : "");
  const sw = await cacheJ("snap"), prev = Object.assign({}, local || {}, sw || {});
  store.set("gp-snap", cur); cacheJ("snap", cur);
  if (!local && !sw) return;
  const fresh = items.filter(i => !(i.id in prev)), ups = items.filter(i => (i.id in prev) && cur[i.id] && prev[i.id] !== cur[i.id] && (notif.all || (notif.fol && follows.includes(i.id))));
  const go = (arr, one, many) => { if (!arr.length) return; const tl = arr.length === 1 ? one + arr[0].name : many + arr.length; banner(tl); if (Notification.permission === "granted") notify(tl, arr.slice(0, 3).map(i => i.owner + "/" + i.name).join("، "), one); };
  if (notif.newp) go(fresh, t("n_new"), t("n_new"));
  go(ups, t("n_upd"), t("n_updn"));
}
async function ask() {
  if (!("Notification" in window)) { toast(t("np_unsup")); return false; }
  if (Notification.permission === "default") await Notification.requestPermission();
  if (Notification.permission !== "granted") { toast(t("np_denied")); return false; }
  return true;
}
async function flip(k) { if (!notif[k] && !(await ask())) return; notif[k] = !notif[k]; store.set("gp-n", notif); syncSW(); panel(); periodic(); }
async function periodic() {
  try {
    const reg = await navigator.serviceWorker.ready; if (!("periodicSync" in reg)) return;
    if (notif.newp || notif.fol || notif.all) { const s = await navigator.permissions.query({name: "periodic-background-sync"}); if (s.state === "granted") await reg.periodicSync.register("gp-check", {minInterval: 3600000}); }
    else await reg.periodicSync.unregister("gp-check");
  } catch(e){}
}
function panel() {
  const p = $("np"); p.textContent = ""; p.append(el("h2", "", t("np_t")));
  [["newp", "np_new"], ["fol", "np_fol"], ["all", "np_all"]].forEach(([k, s]) => { const b = el("button", "chip", t(s)); b.setAttribute("aria-pressed", notif[k]); b.setAttribute("role", "switch"); b.setAttribute("aria-checked", notif[k]); b.onclick = () => flip(k); p.append(b); });
  const ts = el("button", "chip", t("np_test")); ts.onclick = async () => { if (await ask()) notify(t("test_t"), t("test_b"), "gp-test"); };
  p.append(ts, el("p", "", t("np_note")));
  const on = notif.newp || notif.fol || notif.all; $("bell").textContent = on ? "🔔" : "🔕"; $("bell").classList.toggle("on", on);
}
$("bell").onclick = () => $("np").classList.toggle("open");

(async () => {
  if (!phone) phone = await detectPhone();
  applyLang(); controls(); panel(); syncSW(); $("g").append(el("div", "sk"), el("div", "sk"), el("div", "sk"));
  try { const r = await fetch("data/ports.json", {cache: "no-cache"}), d = await r.json(); items = d.items || []; updatedAt = d.updated; } catch(e) {}
  applyLang(); render(); if (items.length) { await checkChanges(); periodic(); }
})();
setInterval(async () => { if (document.hidden) return; try { const d = await (await fetch("data/ports.json", {cache: "no-cache"})).json(); if (d.updated !== updatedAt) { items = d.items || []; updatedAt = d.updated; applyLang(); render(); checkChanges(); } } catch(e){} }, 600000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
